[package]
name = "mini-redis-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "miniredisd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "fs"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
